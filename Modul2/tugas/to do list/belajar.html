<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Example</title>
    <script>
        const apiUrl = 'http://localhost/Modul2/tugas/to%20do%20list/belajar.php';

        // Fetch all tasks
        async function fetchTasks() {
            const response = await fetch(apiUrl);
            const tasks = await response.json();
            document.getElementById('tasks').innerHTML = tasks.map(task => `
                <li>${task.id}: ${task.name} - ${task.tasks} (${task.completed ? 'Completed' : 'Pending'})
                <button onclick="deleteTask(${task.id})">Delete</button>
                <button onclick="updateTask(${task.id})">Update</button>
                </li>
            `).join('');
        }

        // Add a new task
        async function addTask(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const tasks = document.getElementById('task').value;
            const completed = document.getElementById('completed').checked ? 1 : 0;

            await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ name, email, tasks, completed }),
            });

            fetchTasks();
        }

        // Update a task
        async function updateTask(id) {
            const newTasks = prompt('Enter updated task:');
            const completed = confirm('Is it completed?') ? 1 : 0;

            await fetch(apiUrl, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ id, tasks: newTasks, completed }),
            });

            fetchTasks();
        }

        // Delete a task
        async function deleteTask(id) {
            await fetch(apiUrl, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ id }),
            });

            fetchTasks();
        }

        document.addEventListener('DOMContentLoaded', fetchTasks);
    </script>
</head>
<body>
    <h1>Task Management</h1>

    <form onsubmit="addTask(event)">
        <input type="text" id="name" placeholder="Name" required />
        <input type="email" id="email" placeholder="Email" required />
        <input type="text" id="task" placeholder="Task" required />
        <label>
            Completed:
            <input type="checkbox" id="completed" />
        </label>
        <button type="submit">Add Task</button>
    </form>

    <h2>Task List</h2>
    <ul id="tasks"></ul>
</body>
</html>
